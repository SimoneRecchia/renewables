modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SimoneRecchia/renewables/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/SimoneRecchia/renewables"
authors="${mod_authors}"
logoFile="assets/renewables/icon.png"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Both integrations are soft: the mod loads and runs without them.  AFTER makes them load first, so their
# capabilities and peripheral registries exist when this mod looks for them.
[[dependencies.${mod_id}]]
    modId="mekanism"
    mandatory=false
    versionRange="[10.4,11)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="computercraft"
    mandatory=false
    versionRange="[1.109,2)"
    ordering="AFTER"
    side="BOTH"
