name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a new push to the same branch makes an in-flight pr build obsolete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'microsoft'
      # caches the forge userdev artifacts and the decompiled minecraft sources,
      # which otherwise get rebuilt from scratch on every run
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
          if-no-files-found: error

      # CLAUDE.md sections 6 and 7: every asset is generated, and the checkers must pass before anything is done.
      # The tools are standard-library Python only.
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # every generator, in section 6's order, and src/ must come out as committed (PNGs compared by pixels)
      - name: regenerate the assets and compare
        run: python3 tools/check_regenerated.py
      - name: show what the generators changed
        if: failure()
        run: git status --short && git diff --stat
      # check_gui_fits measures text with Minecraft's own font, which the build has just put in ForgeGradle's cache
      - name: extract the vanilla font
        run: |
          jar=$(find ~/.gradle/caches/forge_gradle -name client-extra.jar -path '*1.20.1*' | head -n 1)
          test -n "$jar"
          mkdir -p build/gui-check
          unzip -p "$jar" assets/minecraft/textures/font/ascii.png > build/gui-check/ascii.png
      # every tools/check_*.py, so a new checker runs here without editing this file; check_deployed compares the
      # tree with build/resources/main, which the build step wrote
      - name: run the checkers
        run: |
          failed=""
          for check in tools/check_*.py; do
            [ "$check" = tools/check_regenerated.py ] && continue
            echo "::group::$check"
            python3 "$check" || failed="$failed $check"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed:$failed"
            exit 1
          fi
