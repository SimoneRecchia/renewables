name: release
# nothing here starts on its own: no tag push, no merge. a release is cut from the actions tab, or by hand from
# the github ui, which publish-package.yml picks up the same way
on:
  workflow_dispatch:
    inputs:
      tag:
        description: version to release, e.g. 0.1.0-beta.1. a tag that does not exist yet is made on main's head
        required: true
        type: string

permissions:
  contents: write

# two runs for one tag would race to create it
concurrency:
  group: release-${{ inputs.tag }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      # the version is whatever the tag says; gradle.properties does not get a vote. it lands in the jar's name,
      # in the maven coordinates and in mods.toml, so it is checked before anything is created
      - name: read the version from the tag
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=${TAG#v}
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a version like 0.1.0 or 0.1.0-beta.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-alpha*|*-beta*|*-rc*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      # an existing tag is released as it stands; a new one is only ever made on main
      - name: tag main if the tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG exists, releasing it as it stands"
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::tag $TAG does not exist; run this from main to make it there, or push the tag first"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          echo "tagged $GITHUB_SHA as $TAG"
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          # a release cut by hand from the ui already exists; failing here would take the jar with it
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, leaving its notes alone"
            exit 0
          fi
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          args=(--generate-notes --title "Renewables $VERSION (MC $mc)")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"

  # a release created with the repository's GITHUB_TOKEN does not fire the release event, so the publish is
  # chained here. it is what builds the jar and attaches it to the release
  publish-package:
    needs: release
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/publish-package.yml
    # a called workflow sees no secret it is not passed, and MODRINTH_TOKEN is one
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
