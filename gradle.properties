org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

minecraft_version=1.20.1
# Only what the mod is built and tested on: 1.20.2 and Forge 48 changed the APIs it calls, and a range that
# admits them crashes at load instead of saying so. 47.4.0 is the Forge the README asks for and the build uses.
minecraft_version_range=[1.20.1]
forge_version=47.4.0
forge_version_range=[47.4,48)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# The optional integrations are compiled against their APIs only; the full jars join the dev runs.
mekanism_version=1.20.1-10.4.16.80
cctweaked_version=1.111.0

mod_id=renewables
mod_name=Renewables
# An SPDX id: mods.toml and the Modrinth page both state it, LICENSE is its text, and the README's License says the same.
mod_license=GPL-3.0-only
mod_version=0.1.0
mod_group_id=io.github.simonerecchia.renewables
mod_authors=SimoneRecchia
mod_description=Realistic renewable energy for Minecraft: solar parks, wind farms and the grid that carries them.

# The Modrinth project: its id once it has one, because a slug can be renamed and an id cannot. mods.toml's update
# check and tools/modrinth.py both read it.
modrinth_project=renewables
